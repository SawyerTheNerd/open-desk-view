[package]
name = "spacedesk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Open-source server for the spacedesk protocol (screen capture + input injection)"

[[bin]]
name = "spacedesk-server"
path = "src/main.rs"

[dependencies]
spacedesk-proto = { path = "../spacedesk-proto" }
jpeg-encoder = "0.6"
# H.264 via Cisco's prebuilt OpenH264 (loaded at runtime, hash-verified; see src/h264.rs).
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]
