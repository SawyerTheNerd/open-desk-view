[workspace]
resolver = "2"
members = [
    "crates/spacedesk-proto",
    "crates/spacedesk-viewer",
    "crates/spacedesk-server",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SawyerTheNerd/open-desk-view"
rust-version = "1.80"

[profile.release]
opt-level = 3
lto = "thin"
